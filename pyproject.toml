[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gantt-desktop"
version = "0.19.0"
description = "Independent Python/Qt desktop task and Gantt editor"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "defusedxml>=0.7.1,<1", "mcp>=2.3,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
gantt-desktop = "gantt_desktop.app:main"

[tool.setuptools.package-data]
gantt_desktop = ["qml/*.qml"]

[tool.ruff]
target-version = "py311"

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
